name: Deploy

on:
  push:
      branches: 
        - prod
  workflow_dispatch: 

jobs:
  deploy:
    name: Deploy app to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (for reference only)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # port: ${{ secrets.VPS_PORT }} #(optionnel)
          script: |
            set -e

            # 1. Aller dans le dossier du projet sur le VPS
            cd /var/www/maintenance-car

            # 2. Récupérer les dernières modifications
            git fetch origin
            git checkout prod
            git pull origin prod

            # 3. Construire et lancer les conteneurs en prod
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # 4. Nettoyage des images inutilisées
            docker image prune -f