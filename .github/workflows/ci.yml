name: CI

on:
  push:
      branches: 
        - "**"
  pull_request:
    branches: 
      - prod

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # run: npm ci
        run: npm install

      # Build de prod pour vérifier que ça passe
      - name: Build
        run: npm run build

  backend:
    name: Backend (Adonis.js)
    runs-on: ubuntu-latest
    needs: frontend   # le back ne tourne que si le front est OK (optionnel)

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: maintenance_car_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TZ: UTC
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      NODE_ENV: test
      SESSION_DRIVER: cookie

      APP_KEY: ${{ secrets.BACKEND_APP_KEY }}

      # Connexion à la DB du service "postgres"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: maintenance_car_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        # run: npm ci
        run: npm install

      - name: Run migrations
        run: node ace migration:run --force

      # Tests (avec Japa)
      - name: Run tests
        run: npm test

      # Vérifier que l'app démarre (lint / build / pré-compilation)
      - name: Run build (si tu as une étape build)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "Pas de script build pour le backend, étape ignorée."
          fi
