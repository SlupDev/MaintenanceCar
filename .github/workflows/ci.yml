name: CI

on:
  push:
      branches: 
        - prod
  pull_request:
    branches: 
      - prod

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # run: npm ci
        run: npm install

      # Optionnel si tu as des tests
      # - name: Run tests
      #   run: npm test -- --watch=false

      # Build de prod pour vérifier que ça passe
      - name: Build
        run: npm run build

  backend:
    name: Backend (Adonis.js)
    runs-on: ubuntu-latest
    needs: frontend   # le back ne tourne que si le front est OK (optionnel)

    defaults:
      run:
        working-directory: ./backend

    # env:
    #   NODE_ENV: test
    #   PORT: 3333
    #   APP_KEY: ${{ secrets.BACKEND_APP_KEY }} 
    #   HOST: 127.0.0.1
    #   LOG_LEVEL: info

    #   DB_HOST: ${{ secrets.BACKEND_DB_HOST }}
    #   DB_PORT: ${{ secrets.BACKEND_DB_PORT }}
    #   DB_USER: ${{ secrets.BACKEND_DB_USER }}
    #   DB_PASSWORD: ${{ secrets.BACKEND_DB_PASSWORD }}
    #   DB_DATABASE: ${{ secrets.BACKEND_DB_DATABASE }}

    #   SESSION_DRIVER: cookie

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Create .env for CI
        run: |
          cat << 'EOF' > .env
          NODE_ENV=test
          PORT=3333
          APP_KEY=some_random_app_key_for_tests
          HOST=127.0.0.1
          LOG_LEVEL=info

          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=test_user
          DB_PASSWORD=test_password
          DB_DATABASE=test_db

          SESSION_DRIVER=cookie
          EOF

      - name: Install dependencies
        # run: npm ci
        run: npm install

      # Si Adonis utilise des variables d'env pour les tests,
      # tu peux les définir via les "Secrets" GitHub et les exporter ici.
      # - name: Copy .env
      #   run: cp .env.ci .env

      # Tests (par exemple avec Japa)
      - name: Run tests
        run: npm test

      # Vérifier que l'app démarre (lint / build / pré-compilation)
      - name: Run build (si tu as une étape build)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "Pas de script build pour le backend, étape ignorée."
          fi
