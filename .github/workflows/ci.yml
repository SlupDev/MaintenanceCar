name: CI

on:
  push:
      branches: 
        - prod
  pull_request:
    branches: 
      - prod

jobs:
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Optionnel si tu as des tests
      - name: Run tests
        run: npm test -- --watch=false

      # Build de prod pour vérifier que ça passe
      - name: Build
        run: npm run build

  backend:
    name: Backend (Adonis.js)
    runs-on: ubuntu-latest
    needs: frontend   # le back ne tourne que si le front est OK (optionnel)

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Si Adonis utilise des variables d'env pour les tests,
      # tu peux les définir via les "Secrets" GitHub et les exporter ici.
      # - name: Copy .env
      #   run: cp .env.ci .env

      # Tests (par exemple avec Japa)
      - name: Run tests
        run: npm test

      # Vérifier que l'app démarre (lint / build / pré-compilation)
      - name: Run build (si tu as une étape build)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "Pas de script build pour le backend, étape ignorée."
          fi
