version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: maintenance-car-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - maintenance-car-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: maintenance-car-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3333
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - maintenance-car-network

  # Frontend (Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: serve
    container_name: maintenance-car-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    depends_on:
      - backend
    networks:
      - maintenance-car-network

networks:
  maintenance-car-network:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
