# version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: maintenance-car-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-maintenance_car}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maintenance-car-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: maintenance-car-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3333}:3333"
    environment:
      NODE_ENV: development
      PORT: 3333
      HOST: 0.0.0.0

      CHOKIDAR_USEPOLLING: "true"   # force le polling
      CHOKIDAR_INTERVAL: "300"      # ms (ajuste 100–500 si besoin)
      WATCHPACK_POLLING: "true"     # inoffensif, utile si un watcher Webpack traine
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - maintenance-car-network
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: maintenance-car-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - maintenance-car-network
    command: npm run dev

networks:
  maintenance-car-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
